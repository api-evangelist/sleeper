aid: sleeper
name: Sleeper
description: >-
  Sleeper is a fantasy sports platform — a mobile-first app for creating and
  managing fantasy football, basketball, and other sports leagues with chat,
  drafts, waivers, and real-time scoring built in. Sleeper publishes a free,
  read-only HTTP API at api.sleeper.app that exposes public fantasy data: users,
  leagues, rosters, matchups, transactions, drafts, draft picks, traded picks,
  trending players, and the current sport/season state. The API requires no API
  token or OAuth because no content can be modified through it; every endpoint
  is a GET request returning JSON, and callers are asked to stay under 1,000
  requests per minute to avoid IP blocks. Sleeper is backed by a16z and General
  Catalyst.
